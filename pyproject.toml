[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "macguard"
version = "2.0.0"
description = "MacGuard On-Demand Maintenance Engine for macOS"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "MacGuard Team" }]

[project.scripts]
macguard = "macguard.cli:main"
